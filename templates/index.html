<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Allergy Risk</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <script src="https://api-maps.yandex.ru/2.1/?apikey=ef45c9a8-2dbb-41a1-af00-3a189a8eb9bb&lang=ru_RU&load=package.full"
        type="text/javascript"></script>
</head>

<body>

    <div class="app-shell">

        <!-- LEFT -->
        <aside class="sidebar">

            <div class="brand">

                <div class="brand-logo">
                    AR
                </div>

                <div>
                    <div class="brand-title">
                        Allergy Risk
                    </div>

                    <div class="brand-subtitle">
                        безопасный маршрут
                    </div>
                </div>
            </div>

            <!-- MODES -->
            <nav class="side-menu">

                <button
                    class="side-link"
                    id="mode-map">

                    🌾 Карта пыльцы

                </button>

                <button
                    class="side-link active"
                    id="mode-route">

                    🛣️ Маршруты

                </button>

            </nav>

            <!-- ALLERGENS -->
            <div class="side-card">

                <div class="side-card-title">
                    Аллергены
                </div>

                <div class="allergen-list">

                    <button
                        class="allergen-item active"
                        data-allergen="birch">

                        🌳 Берёза

                    </button>

                    <button
                        class="allergen-item"
                        data-allergen="grass">

                        🌾 Злаки

                    </button>

                    <button
                        class="allergen-item"
                        data-allergen="ragweed">

                        🚨 Амброзия

                    </button>

                </div>
            </div>

            <!-- RESET -->
            <button
                id="reset-route-btn"
                class="reset-btn">

                🔄 Сбросить маршрут

            </button>

            <div class="status-box"
                id="route-status">

                Выберите точку A

            </div>

        </aside>

        <!-- CENTER -->
        <main class="main-layout">

            <header class="topbar">

                <div>

                    <div
                        class="page-title"
                        id="page-title">

                        Безопасный маршрут

                    </div>

                    <div
                        class="page-subtitle"
                        id="page-subtitle">

                        Выберите точки A и Б

                    </div>

                </div>

            </header>

            <section class="map-panel">

                <div id="map"></div>

            </section>

        </main>

        <!-- RIGHT -->
        <aside class="rightbar">

    <!-- ================= MAP MODE ================= -->
    <div id="map-panel">

        <div class="panel-card">

            <div class="panel-title">
                🌾 Информация о точке
            </div>

            <div class="map-main-risk" id="main-risk-box">
                —
            </div>

            <div class="map-main-info" id="main-info">
                Нажмите на карту
            </div>

        </div>

        <div class="panel-card">
            <div class="panel-title">🌤️ Погода</div>
            <div class="map-info" id="weather-info">—</div>
        </div>

        <div class="panel-card">
            <div class="panel-title">🌫️ Воздух</div>
            <div class="map-info" id="air-info">—</div>
        </div>

        <div class="panel-card">
            <div class="panel-title">📅 Прогноз</div>
            <div class="map-info" id="forecast-info">—</div>
        </div>

    </div>

    <!-- ================= ROUTE MODE ================= -->
    <div id="route-panel">

        <div class="panel-card">

            <div class="panel-title">Точка A</div>

            <div class="risk-badge" id="point-a-risk">—</div>

            <div class="point-meta">
                Координаты:
                <span id="point-a-coords">—</span>
            </div>

        </div>

        <div class="panel-card">

            <div class="panel-title">Точка Б</div>

            <div class="risk-badge" id="point-b-risk">—</div>

            <div class="point-meta">
                Координаты:
                <span id="point-b-coords">—</span>
            </div>

        </div>

        <div class="panel-card">

            <div class="panel-title">🛡️ Маршрут</div>

            <div class="route-risk-box" id="route-risk">—</div>

            <div class="route-details" id="route-details">
                Маршрут ещё не построен
            </div>

        </div>

        <div class="panel-card">

            <div class="panel-title">💡 Рекомендации</div>

            <div class="route-details" id="comparison">—</div>

        </div>

    </div>

</aside>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
