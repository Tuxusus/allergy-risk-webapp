{% extends "admin/base_admin.html" %}

{% block content %}
<div class="admin-card">
    <h2>📊 Статистика опасных зон по аллергенам</h2>
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #f0f0f0;">
                <th style="padding: 10px;">Аллерген</th>
                <th style="padding: 10px;">Количество зон</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stats %}
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 8px;">{{ s.allergen_label }}</td>
                <td style="padding: 8px;"><strong>{{ s.count }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
