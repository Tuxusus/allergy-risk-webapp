<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - Allergy Risk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            background: white;
            border-radius: 24px;
            padding: 20px 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 24px; color: #1a2a3a; }
        .admin-header .user-info { color: #4a5a6a; }
        .admin-header .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        .admin-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .admin-card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #2ecc71;
        }
        button, .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button.danger { background: #e74c3c; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th { background: #f8fafc; }
        .message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔧 Админ-панель Allergy Risk</h1>
            <div>
                <span class="user-info">{{ username }} ({{ role }})</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script>
        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/'; });
        }
    </script>
</body>
</html>
