<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель - Allergy Risk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-dark: #f0f9f0;
            --bg-card: #ffffff;
            --border: #d4eed4;
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --danger: #e74c3c;
            --danger-bg: #fee2e2;
            --success: #10b981;
            --text-muted: #7f8c8d;
        }
        
        body {
            background: linear-gradient(135deg, #f0f9f0 0%, #d5f0d5 100%);
            font-family: 'Inter', system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .admin-header {
            background: white;
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        
        .admin-header h1 {
            font-size: 20px;
            color: var(--primary-dark);
        }
        
        .admin-header .user-info {
            color: var(--text-muted);
            margin-right: 16px;
            font-size: 13px;
        }
        
        /* ОБЩИЙ СТИЛЬ ДЛЯ ВСЕХ КНОПОК */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: transparent;
            border: none;
        }
        
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 16px;
        }
        
        /* ЗЕЛЕНАЯ КНОПКА (Назначить, Добавить зону) - яркая */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }
        
        /* БЛЕДНО-ПРОЗРАЧНАЯ КРАСНАЯ КНОПКА (Снять права, Заблокировать, Удалить) */
        .btn-danger-pale {
            background: #fee2e2;
            color: #e74c3c;
            border: 1px solid #fecaca;
        }
        
        .btn-danger-pale:hover {
            background: #e74c3c;
            color: white;
            transform: translateY(-2px);
            border-color: #e74c3c;
        }
        
        /* БЛЕДНО-ПРОЗРАЧНАЯ ЗЕЛЕНАЯ КНОПКА (Разблокировать) */
        .btn-success-pale {
            background: rgba(46, 204, 113, 0.12);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.25);
        }

        .btn-success-pale:hover {
            background: #2ecc71;
            color: white;
            transform: translateY(-2px);
            border-color: #2ecc71;
        }
        
        /* КНОПКА ВЫХОДА */
        .btn-logout {
            border: 1px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }
        
        .btn-logout:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }
        
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .admin-card h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--primary);
            font-weight: 600;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #f8faf8;
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .admin-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .form-group {
            display: flex;
            gap: 12px;
            flex: 1;
            flex-wrap: wrap;
        }
        
        .form-field {
            flex: 1;
            min-width: 180px;
        }
        
        .form-field label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 10px 14px;
            background: #f8faf8;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #2c3e50;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th, 
        .admin-table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        
        .admin-table th {
            color: var(--primary);
            font-weight: 600;
            background: #f8faf8;
        }
        
        .admin-table tr:hover {
            background: #f8faf8;
        }
        
        .empty-message {
            color: var(--text-muted);
            text-align: center;
            padding: 30px;
            font-size: 13px;
        }
        
        .zone-name {
            font-weight: 600;
        }
        
        .coords {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .status-active {
            color: var(--primary);
            font-weight: 600;
        }
        
        .status-blocked {
            color: var(--danger);
            font-weight: 600;
        }
        
        .action-cell {
            text-align: center;
        }
        
        .routes-count {
            text-align: center;
            font-weight: 600;
            color: var(--primary);
        }
        
        .risk-low-badge, .risk-medium-badge, .risk-high-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            text-align: center;
        }
        
        .risk-low-badge {
            background: #d1fae5;
            color: var(--success);
        }
        
        .risk-medium-badge {
            background: #fef3c7;
            color: #f39c12;
        }
        
        .risk-high-badge {
            background: #fce4e4;
            color: var(--danger);
        }
        
        .badge {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 6px;
        }
        
        .user-id-badge {
            background: #a8e6cf;
            color: #27ae60;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 8px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Админ-панель Allergy Risk</h1>
            <div>
                <span class="user-info">{{ username }} ({{ role }})</span>
                <a href="/logout" class="btn btn-logout" id="logout-admin-link">Выйти</a>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
