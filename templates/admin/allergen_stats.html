{% extends "admin/base_admin.html" %}

{% block content %}
<div class="admin-card">
    {% if stats and stats|length > 0 %}
    <table class="admin-table">
        <thead>
            <tr>
                <th>Аллерген</th>
                <th>Количество зон</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stats %}
            <tr>
                <td>{{ s.allergen_label }}</td>
                <td><strong>{{ s.count }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty-message">Нет данных об опасных зонах</p>
    {% endif %}
</div>
{% endblock %}
