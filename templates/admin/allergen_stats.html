<div class="admin-card">
    <h2>📊 Статистика опасных зон по аллергенам</h2>
    
    {% if stats %}
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: var(--panel-soft);">
                <th style="padding: 12px; text-align: left;">Аллерген</th>
                <th style="padding: 12px; text-align: left;">Количество зон</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stats %}
            <tr style="border-bottom: 1px solid var(--border);">
                <td style="padding: 10px;">{{ s.allergen_label }}</td>
                <td style="padding: 10px;"><strong>{{ s.count }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p style="color: var(--text-muted);">📭 Нет данных об опасных зонах</p>
    {% endif %}
</div>
