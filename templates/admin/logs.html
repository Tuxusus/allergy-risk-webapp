{% extends "admin/base_admin.html" %}

{% block content %}
<div class="admin-card">
    {% if logs %}
    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Действие</th>
                <th>Дата и время</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td><span class="user-id-badge">{{ log.user_id }}</span></span>
                <td><strong>{{ log.username }}</strong></span>
                <td class="action-cell">{{ log.action }}</span>
                <td class="coords">{{ log.created_at }}</span>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty-message">Логи отсутствуют</p>
    {% endif %}
</div>
{% endblock %}
